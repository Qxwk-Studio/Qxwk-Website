    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
        function bind() {
            var btn = document.getElementById('themeToggle');
            if (btn) btn.addEventListener('click', toggle);
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>

        const PROBE_TIMEOUT = 6000;              // 探活超时(ms)
const PROBE_URLS = {                      // 每个主域名对应的探测地址（HTTP 站点）
    'home.qxwkstudio.top': location.origin + '/',
    'account.qxwkstudio.top': 'https://account.qxwkstudio.top/',
    'travel.qxwkstudio.top': 'https://travel.qxwkstudio.top/',
    'blog.qxwkstudio.top': 'https://blog.qxwkstudio.top/',
    'mail.qxwkstudio.top': 'https://mail.qxwkstudio.top/',
    'class.qxwkstudio.top': 'https://class.qxwkstudio.top/'
};

// 单域探活：no-cors 跨域 HEAD，能收到服务端响应即视为可达（opaque 不读状态码），超时或网络错误视为离线
function probe(url, timeout) {
    return new Promise(resolve => {
        const ac = new AbortController();
        const t = setTimeout(() => ac.abort(), timeout);
        fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: ac.signal })
            .then(() => { clearTimeout(t); resolve(true); })
            .catch(() => { clearTimeout(t); resolve(false); });
    });
}

// 并发检测所有主域名并回填状态徽章
function startStatusChecks() {
    const chips = document.querySelectorAll('.domain-status');
    domains.forEach((d, i) => {
        const probeUrl = PROBE_URLS[d.domain];
        const chip = chips[i];
        if (!probeUrl || !chip) { if (chip) { setState(chip, probeUrl ? 'checking' : 'ok'); } return; }
        probe(probeUrl, PROBE_TIMEOUT).then(ok => setState(chip, ok ? 'ok' : 'down', d.domain));
    });
}
function setState(chip, state, domain) {
    chip.dataset.state = state;
    chip.textContent = state === 'ok' ? '在线' : (state === 'down' ? '离线' : '检测中');
    chip.title = state === 'down' && domain ? `无法从当前网络访问 ${domain}` : '';
}

function renderDomains() {
            const list = document.getElementById('domainList');
            if (!list) return;
            let html = '';
            domains.forEach((d, i) => {
                let sub = '';
                const n = String(i + 1).padStart(2, '0');
                if (d.children && d.children.length) {
                    const items = d.children.map(c =>
                        `<div class="domain-item">
                            <span class="domain-dot"></span>
                            <span class="domain-item-domain">${esc(c.name + '.' + d.domain)}</span>
                            <span class="domain-item-desc">${esc(c.desc)}</span>
                        </div>`
                    ).join('');
                    sub = `<div class="domain-sub">
                        <div class="domain-sub-label">子域名</div>
                        ${items}
                    </div>`;
                }
                html += `<div class="domain-card">
                    <div class="domain-top">
                        <span class="domain-name"><span class="domain-index">${n}</span>${esc(d.domain)}</span>
                        <span class="domain-status" data-state="checking" title="正在检测…">检测中</span>
                    </div>
                    <div class="domain-title">${esc(d.title)}</div>
                    <div class="domain-desc">${esc(d.desc)}</div>
                    <div class="domain-tech">${esc(d.tech)}</div>
                    ${sub}
                </div>`;
            });
            list.innerHTML = html;
            startStatusChecks();
        }
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        renderDomains();

        // Navbar scroll
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });
    </script>
</body>
</html>
