<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站链接 - 青翔未阔工作室</title>
    <meta name="description" content="青翔未阔工作室网站链接，值得关注的站点与伙伴。">
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff;
            --primary-subtle: rgba(37,99,235,0.08); --secondary: #0d9488;
            --surface: #ffffff; --bg: #f8fafc; --text-primary: #0f172a; --text-secondary: #64748b;
            --text-tertiary: #94a3b8; --border: #e2e8f0;
            --navbar-bg: rgba(255, 255, 255, 0.8); --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-sm: 8px; --radius-md: 14px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            --container: 1100px; --nav-height: 64px;
        }
        html { scroll-behavior: smooth; scroll-padding-top: var(--nav-height); }
        body {
            font-family: var(--font-sans); background: var(--bg); color: var(--text-primary);
            line-height: 1.6; -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        /* ===== Navbar ===== */
        .navbar {
            position: sticky; top: 0; width: 100%; height: var(--nav-height); z-index: 100;
            background: var(--navbar-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), box-shadow var(--transition);
        }
        .navbar.scrolled { background: rgba(255, 255, 255, 0.95); box-shadow: 0 1px 12px rgba(0,0,0,0.08); }
        .navbar-inner {
            max-width: var(--container); margin: 0 auto; padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between; height: 100%;
        }
        .navbar-brand {
            display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-primary);
            font-weight: 600; font-size: 1.15rem; letter-spacing: 0.3px; transition: opacity var(--transition);
        }
        .navbar-brand:hover { opacity: 0.85; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px;
            background: rgba(37,99,235,0.15); color: var(--text-primary); text-decoration: none;
            border-radius: 40px; font-size: 0.88rem; font-weight: 500;
            backdrop-filter: blur(4px); border: 1px solid rgba(147,197,253,0.35);
            transition: all var(--transition); white-space: nowrap;
        }
        .back-link:hover { background: rgba(37,99,235,0.3); border-color: rgba(147,197,253,0.6); transform: scale(1.02); }
        /* ===== Main ===== */
        .main { flex: 1; padding: 40px 24px 60px; }
        .container { max-width: var(--container); margin: 0 auto; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
            gap: 16px; margin-bottom: 36px;
        }
        .page-header h1 {
            font-size: clamp(1.5rem,3vw,2rem); font-weight: 700; color: var(--text-primary);
        }
        .section { margin-bottom: 40px; }
        .section-title {
            font-size: 1.3rem; font-weight: 600; color: var(--text-primary);
            margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center;
        }
        .section-title svg { flex-shrink: 0; }
        /* ===== 链接卡片（与主页一致） ===== */
        .link-group-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 28px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }
        .link-group-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-align: center;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
            margin-bottom: 32px;
        }
        .link-group:last-child .link-grid { margin-bottom: 0; }
        .link-card {
            display:flex;flex-direction:row;align-items:center;gap:12px;
            padding:14px 18px;background:var(--surface);
            border:1px solid var(--border);border-radius:var(--radius-sm);
            text-decoration:none;color:var(--text-primary);
            transition:transform var(--transition), box-shadow var(--transition);
        }
        .link-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:rgba(37,99,235,0.2); }
        .link-card-icon { width:28px; height:28px; border-radius:6px; flex-shrink:0; object-fit:contain; background:var(--bg); }
        .link-card-icon-fallback {
            display:flex;
            align-items:center;
            justify-content:center;
            width:28px;
            height:28px;
            border-radius:6px;
            flex-shrink:0;
            background:var(--primary-subtle);
            color:var(--primary);
            font-size:0.85rem;
            font-weight:600;
            line-height:1;
        }
        .link-card-text { display:flex; flex-direction:column; gap:3px; min-width:0; }
        .link-card-text > span:first-child { font-weight: 600; }
        .link-card-text > span:last-child { font-size: 0.84rem; color: var(--text-secondary); }
        /* ===== Footer ===== */
        .footer {
            background: #0f172a; text-align: center; padding: 28px 24px;
            color: var(--text-tertiary); font-size: 0.82rem; border-top: 1px solid rgba(255,255,255,0.06);
        }
        .footer-copy { opacity: 0.6; }
        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .navbar-inner { padding: 0 16px; }
            .main { padding: 28px 16px 40px; }
            .link-grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
    <meta name="color-scheme" content="light dark">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
        function bind() {
            var btn = document.getElementById('themeToggle');
            if (btn) btn.addEventListener('click', toggle);
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
    <style>
        /* ===== 黑夜模式：主题切换按钮 ===== */
        .theme-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0; background:none; border:none; border-radius:50%; color:var(--text-primary); cursor:pointer; transition:background var(--transition), color var(--transition); }
        .theme-toggle:hover { background:var(--primary-subtle); color:var(--primary); }
        .theme-toggle svg { width:22px; height:22px; }
        .theme-toggle .icon-sun { display:none; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display:block; }
        :root[data-theme="dark"] .theme-toggle .icon-moon { display:none; }

        /* ===== 黑夜模式：深色变量 ===== */
        :root { color-scheme: light; --primary-light:#eff6ff; --primary-subtle:rgba(37,99,235,0.08); }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --primary-light: rgba(59,130,246,0.16);
            --primary-subtle: rgba(59,130,246,0.16);
            --surface:#1e293b; --bg:#0f172a;
            --text-primary:#e2e8f0; --text-secondary:#94a3b8; --text-tertiary:#64748b;
            --border:#334155; --navbar-bg:rgba(15,23,42,0.8);
            --shadow-sm:0 1px 3px rgba(0,0,0,0.4); --shadow-md:0 4px 16px rgba(0,0,0,0.5); --shadow-lg:0 12px 40px rgba(0,0,0,0.6);
        }
        :root[data-theme="dark"] .footer { background:#111827; }

        /* ===== 黑夜模式：页面元素覆盖 ===== */
        :root[data-theme="dark"] .back-link { background:rgba(59,130,246,0.16); border-color:rgba(96,165,250,0.35); }
        :root[data-theme="dark"] .back-link:hover { background:rgba(59,130,246,0.30); border-color:rgba(96,165,250,0.60); }
        :root[data-theme="dark"] .navbar.scrolled { background:rgba(15,23,42,0.95); box-shadow:0 1px 12px rgba(0,0,0,0.4); }
    </style>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="navbar-inner">
            <a href=".." class="navbar-brand">
                <img src="/favicon.webp" alt="青翔未阔工作室" width="28" height="28" style="border-radius:5px; flex-shrink:0;">
                <span>青翔未阔工作室</span>
            </a>
            <div style="display:flex;align-items:center;gap:10px;">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换主题">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <a href="../.." class="back-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                    返回首页
                </a>
            </div>
        </div>
    </header>

    <div class="main">
        <div class="container">
            <div class="page-header">
                <h1>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px; margin-right:8px;"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                    网站链接
                </h1>
            </div>

            <!-- 链接内容由 links.json 加载渲染 -->
            <div id="linksContainer"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-copy">2026 青翔未阔工作室</div>
    </footer>

    <script>
        // Navbar scroll
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });
    </script>

    <script>
        /* 链接内容由 links.json 加载渲染 */
        (function () {
            var container = document.getElementById('linksContainer');
            if (!container) return;

            /* favicon 加载失败时，用站点首文字兜底 */
            container.addEventListener('error', function (e) {
                var target = e.target;
                if (target && target.tagName === 'IMG' && target.classList.contains('link-card-icon')) {
                    var titleEl = target.parentElement.querySelector('.link-card-text span:first-child');
                    var ch = titleEl && titleEl.textContent ? titleEl.textContent.charAt(0) : '?';
                    var span = document.createElement('span');
                    span.className = 'link-card-icon-fallback';
                    span.textContent = ch;
                    target.replaceWith(span);
                }
            }, true);

            /* 图标库：links.json 中 icon 字段填名称，对应此处 SVG 路径（数据与展示分离） */
            var ICONS = {
                minecraft: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
                window: '<path d="M4 6h16v12H4z"/>',
                plus: '<path d="M3 12h18M12 3v18"/>',
                cross: '<path d="M5 12h14M12 5v14"/>',
                launcher: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
                sparkle: '<path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/>',
                book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
                server: '<rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
                globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
                chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
                convert: '<path d="M7 7h13"/><path d="M17 3l4 4-4 4"/><path d="M17 17H4"/><path d="M7 13l-4 4 4 4"/>',
                image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
                tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
                train: '<rect x="4" y="3" width="16" height="12" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="M8 19l-2 3"/><path d="M16 19l2 3"/>',
                cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>',
                game: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4"/><circle cx="15" cy="11" r="1"/><circle cx="18" cy="13" r="1"/>',
                video: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
                type: '<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>',
                link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'
            };

            function svg(iconName, color, size) {
                var paths = ICONS[iconName];
                if (!paths) return '';
                return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="' + color +
                    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
            }

            function render(data) {
                var html = (data.sections || []).map(function (s) {
                    var groups = (s.groups || []).map(function (g) {
                        var cards = (g.links || []).map(function (l) {
                            var host = '';
                            try { host = new URL(l.url).host; } catch (e) { }
                            var desc = l.desc ? '<span>' + l.desc + '</span>' : '';
                            return '<a href="' + l.url + '" target="_blank" rel="noopener noreferrer" class="link-card">' +
                                (host ? '<img src="https://' + host + '/favicon.ico" alt="" class="link-card-icon" loading="lazy">' : '') +
                                '<div class="link-card-text"><span>' + l.title + '</span>' + desc + '</div></a>';
                        }).join('');
                        return '<div class="link-group"><h3 class="link-group-title">' + svg(g.icon, g.color, 18) + g.title +
                            '</h3><div class="link-grid">' + cards + '</div></div>';
                    }).join('');
                    return '<div class="section"><h2 class="section-title">' + svg(s.icon, s.color, 20) + s.title +
                        '</h2><p class="link-group-desc">' + (s.desc || '') + '</p>' + groups + '</div>';
                }).join('');
                container.innerHTML = html;
            }

            fetch('links.json', { cache: 'no-cache' })
                .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(render)
                .catch(function () {
                    container.innerHTML = '<p class="link-group-desc">链接数据加载失败，请稍后重试。</p>';
                });
        })();
    </script>
</body>
</html>
